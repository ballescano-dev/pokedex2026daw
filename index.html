<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <div id="header" class="container-fluid primary-bg">
        <div class="row align-items-center">
          <div class="logo-container col-8 col-lg-4 d-flex align-items-center">
            <img src="./img/logo.png" alt="Logo Pokedex" class="img-fluid">
            <div class="logo-text">
              <span>POKÉDEX</span>
              <small>MODEL HANDY099</small>
            </div>
          </div>
          <div class="navbar-container col-4 col-lg-5">
            <nav class="navbar navbar-expand-lg">
              <div class="container-fluid justifiy-content-end">
                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                  <i class="bi bi-list text-white fs-3"></i>
                </button>
                <div id="navbarNav" class="collapse navbar-collapse">
                  <ul class="navbar-nav justifiy-content-center w-100">
                    <li class="navitem">
                      <a href="#" class="nav-link">KANTO DEX</a>
                    </li>
                    <li class="navitem">
                      <a href="#" class="nav-link">TYPE MATCHUPS</a>
                    </li>
                    <li class="navitem">
                      <a href="#" class="nav-link">CRIES ARCHIVE</a>
                    </li>
                    <li class="navitem">
                      <a href="#" class="nav-link">DIAGNOSTICS</a>
                    </li>
                  </ul>
                </div>
              </div>
            </nav>
          </div>
          <!-- BUSCADOR PEQUENNO, VOX READY Y USER -->
          <div class="col-lg-3"></div>
        </div>
      </div>
    </header>

    <main>
      <div class="container-fluid main-bg">
        <div id="main-header" class="row align-items-center g-3">
          <div id="form-search" class="col-12 col-lg-5">
            <form action="#" method="get" class="input-group align-items-center">
              <button type="submit" id="search-button" class="btn">
                <i class="bi bi-search"></i>
              </button>
              <div id="input-container-search-pokemon" class="form-floating">
                <input type="text" name="pokemon-search" id="pokemon-search" class="form-control" placeholder="Buscar pokémon (por nombre o N.º)..." autocomplete="off" disabled>
                <label for="pokemon-search">Buscar pokémon (por nombre o N.º)...</label>
                <div id="result-search-container" class="d-none"></div>
              </div>
              <input type="reset" id="reset-button" class="btn" value="RESET"></input>
            </form>
          </div>
          <div id="filters" class="col12 col-lg-5">
            <span>FILTRO:</span>
            <div class="filter-controls d-flex flex-wrap align-items-center justifiy-content-center gap-1">
              <!-- rellenar dinamicamente en el js -->
            </div>
          </div>
          <div id="dexter-voice" class="col-12 col-lg-2 d-flex align-items-center justify-content-center">
            <button type="button" class="btn dexter-voice-btn">
              <i class="bi bi-circle-fill voice-indicator"></i>
              <span>VOZ DE DEXTER</span>
              <i class="bi bi-volume-up-fill"></i>
            </button>
          </div>
          <div id="main-container">
            <div class="row align-items-center">
              <div class="col-6">
                <img src="./img/logo.png" alt="Pokedex logo" class="img-fluid">
              </div>
              <div class="col-6 text-end d-flex flex-column">
                <span id="kanto-os">KANTO OS HANDY909</span>
                <span>REPLICATOR UNIT // DUAL-BUS ARCH</span>
              </div>
            </div>
            <div class="row g-3 pokemon-info">
              <div class="col-12 col-lg-6">
                <div id="left-container" class="p-3">
                  <div class="container">
                    <div class="row header-current-pokemon-display">
                      <div class="col">
                        <i class="bi bi-circle-fill"></i>
                        <i class="bi bi-circle-fill"></i>
                      </div>
                      <div class="col text-end">
                        <span id="scan-cam">SCAN-CAM: MATRIX</span>
                        <i class="bi bi-circle-fill scan-indicator"></i>
                      </div>
                    </div>
                    <div class="container current-pokemon-pattern">
                      <div id="header-current-pokemon" class="row">
                        <div class="col">
                          ID: <span class="current-pokemon-id"></span>
                          <i class="bi bi-circle-fill"></i>
                          <span class="current-pokemon-name"></span>
                        </div>
                        <div class="col text-end">
                          MODE: OPTIC-CAPTURE <i class="bi bi-broadcast"></i>
                        </div>
                      </div>
                      <img src="" alt="" id="current-pokemon-image" class="img-fluid mx-auto">
                      <div id="footer-current-pokemon" class="row">
                        <div class="col text-start">
                          <i class="bi bi-soundwave"></i>
                          CRY SYNTH:
                        </div>
                        <div class="col text-end">
                          <div class="border"></div>
                          <div class="border"></div>
                          <div class="border"></div>
                          <div class="border"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <div id="right-container" class="p-3">
                  <div class="container">
                    <div class="row">b</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <footer>
      <script type="module" src="./script.js"></script>
    </footer>
  </body>
</html>
